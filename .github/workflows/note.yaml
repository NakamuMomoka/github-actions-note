name: Note Workflow

on:
  workflow_dispatch:
    inputs:
      theme:
        description: '記事テーマ'
        required: true
        type: string
      target:
        description: '想定読者（ペルソナ）'
        required: true
        type: string
      message:
        description: '読者に伝えたい核メッセージ'
        required: true
        type: string
      cta:
        description: '読後のアクション（CTA）'
        required: true
        type: string
      tags:
        description: 'カンマ区切りタグ（任意）'
        required: false
        default: ''
        type: string
      is_public:
        description: '公開(true)/下書き(false)'
        required: true
        default: 'false'
        type: choice
        options: ['true','false']
      dry_run:
        description: '投稿をスキップ（生成のみ）'
        required: true
        default: 'false'
        type: choice
        options: ['true','false']

permissions:
  contents: read

env:
  TZ: Asia/Tokyo

# ========================================
# ORIGINAL RESEARCH（コメントアウト）
# ========================================
# jobs:
#   research:
#     name: Research (CCSDK WebSearch/WebFetch)
#     ...

# ========================================
# LOW COST RESEARCH（スキップ）
# ========================================
jobs:
  research:
    runs-on: ubuntu-latest
    outputs:
      research_b64: ${{ steps.collect.outputs.research_b64 }}
    steps:
      - name: Dummy research
        run: |
          mkdir -p .note-artifacts
          echo "Research skipped for cost reduction" > .note-artifacts/research.md

      - name: Collect research
        id: collect
        run: |
          b64=$(base64 -w 0 .note-artifacts/research.md 2>/dev/null || base64 .note-artifacts/research.md)
          echo "research_b64<<EOF" >> $GITHUB_OUTPUT
          echo "$b64" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

# ========================================
# WRITE（軽量化）
# ========================================
  write:
    needs: research
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      THEME: ${{ github.event.inputs.theme }}
      TARGET: ${{ github.event.inputs.target }}
      MESSAGE: ${{ github.event.inputs.message }}
      CTA: ${{ github.event.inputs.cta }}
      INPUT_TAGS: ${{ github.event.inputs.tags }}
    outputs:
      title: ${{ steps.collect.outputs.title }}
      draft_json_b64: ${{ steps.collect.outputs.draft_json_b64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install AI SDK
        run: |
          npm init -y
          npm i ai @ai-sdk/anthropic

      - name: Generate draft（低コスト版）
        run: |
          cat > write.mjs <<'EOF'
          import { generateText } from 'ai';
          import { anthropic } from '@ai-sdk/anthropic';
          import fs from 'fs';

          const prompt = `
          テーマ: ${process.env.THEME}
          読者: ${process.env.TARGET}
          伝えたいこと: ${process.env.MESSAGE}
          CTA: ${process.env.CTA}

          note記事として読みやすく、見出し付きで作成してください。
          `;

          const { text } = await generateText({
            model: anthropic('claude-3-haiku'),
            prompt,
            maxTokens: 800
          });

          const data = {
            title: process.env.THEME,
            draftBody: text,
            tags: (process.env.INPUT_TAGS || '').split(',')
          };

          fs.mkdirSync('.note-artifacts', { recursive: true });
          fs.writeFileSync('.note-artifacts/draft.json', JSON.stringify(data));
          EOF

          node write.mjs

      - name: Collect
        id: collect
        run: |
          title=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.note-artifacts/draft.json')).title)")
          b64=$(base64 -w 0 .note-artifacts/draft.json)
          echo "title=$title" >> $GITHUB_OUTPUT
          echo "draft_json_b64=$b64" >> $GITHUB_OUTPUT

# ========================================
# FACT CHECK（完全停止）
# ========================================
# factcheck:
#   ...

  factcheck:
    if: false

# ========================================
# POST（そのまま）
# ========================================
  post:
    needs: write
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    env:
      IS_PUBLIC: ${{ github.event.inputs.is_public }}
      STATE_JSON: ${{ secrets.NOTE_STORAGE_STATE_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm i playwright
          npx playwright install chromium

      - name: Restore draft
        env:
          DRAFT_JSON_B64: ${{ needs.write.outputs.draft_json_b64 }}
        run: |
          echo "$DRAFT_JSON_B64" | base64 -d > draft.json

      - name: Debug
        run: |
          cat draft.json
